name: Radar public-source verification
on:
  workflow_dispatch:
    inputs:
      terms_json:
        description: Public search terms as a JSON list; never private account or portfolio data
        required: false
        default: '["PineDrama","Ray-Ban"]'
      country:
        description: Two-letter country code
        required: false
        default: US
      source_probe:
        description: Capture only fixed public Apple and Federal Reserve feeds; never private holdings
        type: boolean
        required: false
        default: true
  push:
    branches: [main]
    paths:
      - 'news-radar-investing/scripts/camillo_google_trends.py'
      - 'news-radar-investing/scripts/camillo_trends_worker.py'
      - 'news-radar-investing/evals/test_camillo_google_trends.py'
      - 'news-radar-investing/evals/test_camillo_trends_worker.py'
      - 'news-radar-investing/scripts/radar_source_health.py'
      - 'news-radar-investing/evals/test_radar_source_health.py'
      - '.github/workflows/camillo-trends-probe.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Offline contract tests
        run: python3 -m unittest discover -s news-radar-investing/evals -p 'test_*.py' -v
      - name: Public registered-feed probe
        id: source_probe
        if: (github.event_name == 'workflow_dispatch' && inputs.source_probe) || contains(github.event.head_commit.message, '[source-live-probe]')
        continue-on-error: true
        run: >-
          python3 news-radar-investing/scripts/radar_source_health.py collect
          --source-id apple_us_free --source-id apple_ca_free --source-id apple_gb_free
          --source-id apple_us_paid --source-id apple_ca_paid --source-id apple_gb_paid
          --source-id fed_all --output-dir source-probe
      - name: Retain complete public source snapshots and receipts
        if: always() && steps.source_probe.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: radar-source-probe-${{ github.run_attempt }}
          path: source-probe/
          retention-days: 7
          if-no-files-found: warn
      - name: Public-source live probe
        id: probe
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[trends-live-probe]')
        continue-on-error: true
        env:
          TERMS_JSON: ${{ inputs.terms_json || '["PineDrama","Ray-Ban"]' }}
          COUNTRY: ${{ inputs.country || 'US' }}
        run: python3 news-radar-investing/scripts/camillo_trends_worker.py --terms-json "$TERMS_JSON" --country "$COUNTRY" --output-dir trends-probe
      - name: Retain public diagnostic evidence
        if: always() && steps.probe.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: camillo-trends-probe-${{ github.run_attempt }}
          path: trends-probe/
          retention-days: 7
          if-no-files-found: warn
      - name: Do not confuse test success with connection success
        if: steps.probe.outcome == 'failure' || steps.source_probe.outcome == 'failure'
        run: exit 2
